<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Add your CSS styles here */
    h1,h2 {
        color: blue;
        text-align: center;
    }
    p {
        font-size: 16px;
     color: yellow;
        background-color: red;
    }
    div {
    background-color: lightgray !important;
    padding: 20px;
     margin: 10px;
    }
    #div-id1 {
    background-color: lightblue;
    padding: 15px;
    margin: 5px;
    }
    #div-id2 {
    background-color: lightgreen;
    padding: 15px;
    margin: 5px;
    }
    .div-class {
        border: 2px solid black;
        padding: 10px;
    }
    h1, #div-id1, #div-id2, .div-class {
        font-family: 'Gill Sans', 'Gill Sans MT', sans-serif;
    }
    a:hover {
        color: red;
       font-weight: bold;
    }
    a:visited {
        color: purple;
    }
    </style>
 
</head>
<body>
    <h1>Welcome to My Website</h1>
    <h2 style="color: green; background-color: aqua;">This is a subheading</h2>
    <div>
        <p>This is a simple paragraph inside a styled div.</p>
    </div>
    <div id="div-id1">
        <p>This is another paragraph inside a different styled div.</p>
    </div>
    <div id="div-id2" class="div-class">
        <p>This is a third paragraph inside a styled div.</p>
    </div>
    <a href="https://www.example.com" target="_blank">Visit Example</a>
</body>
</html>
